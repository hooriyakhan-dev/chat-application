<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hoories — your people, always close</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23ff9db8'/%3E%3Cstop offset='1' stop-color='%239e85ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='20' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='39' font-weight='bold' text-anchor='middle' fill='white'%3EH.%3C/text%3E%3C/svg%3E" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Bricolage+Grotesque:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sky"><i></i><i></i><i></i></div>

    <div id="app" class="app" hidden>
      <nav class="rail">
        <div class="logo">H.</div>
        <button class="nav" data-v="dash" title="Dashboard" aria-label="Dashboard"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/></svg></button>
        <button class="nav on" data-v="chat" title="Chats" aria-label="Chats">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.6-.8L3 21l1.9-5.2A8.4 8.4 0 1 1 21 11.5z"
            /></svg
          ><em id="unr"></em>
        </button>
        <button class="nav" data-v="stat" title="Status" aria-label="Status"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke-dasharray="3.2 2.6" /><circle cx="12" cy="12" r="3" /></svg></button>
        <button class="nav" id="peopleNav" title="Find people" aria-label="Find people"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.7-5.7 6.5-5.7s6.5 2.1 6.5 5.7M17 5.5a3 3 0 0 1 0 5.8M18 14.5c2.2.6 3.5 2.4 3.5 5"/></svg></button>
        <button class="nav" id="groupsNav" title="Create a group" aria-label="Create a group"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3.2"/><path d="M2 20c0-3.5 2.4-5.5 6-5.5 2 0 3.6.6 4.7 1.7M17 8h5m-2.5-2.5v5M16 16h5v5h-5z"/></svg></button>
        <button class="nav" id="pinsNav" title="Pinned messages" aria-label="Pinned messages"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 5 5-4 1-3 3-1 5-3-3-5 5-1-1 5-5-3-3 5-1 3-3z"/></svg></button>

        <button class="nav" data-v="prof" title="Profile" aria-label="Profile">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
          </svg>
        </button>
        <div class="sp"></div>
        <button class="nav" id="stg" title="Appearance &amp; privacy" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.6.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.6-.9l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.9l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.6-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.6.9l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.8z"/></svg></button>
        <button
          class="nav"
          id="thb"
          title="Light or dark"
          aria-label="Toggle theme"
        >
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg>
        </button>
        <button
          id="meBtn"
          title="Change profile photo"
          aria-label="Change profile photo"
        >
          <span id="meAv"></span>
        </button>
        <input type="file" id="af2" accept="image/*" hidden />
        <button class="out" id="lo">Log out</button>
      </nav>
      <div id="chatv" class="chatv">
        <aside class="list">
          <div class="lh">
            <h2>Chats</h2>
            <button
              class="addp"
              id="addp"
              aria-label="Add a person"
              title="Add a person"
            >
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
              </svg>
            </button>
          </div>
          <input class="q" id="q" placeholder="Search people and groups" aria-label="Search chats" />
          <div class="chat-filters" role="group" aria-label="Chat folders">
            <button class="folder-tab on" data-folder="all" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg> All chats</button>
            <button class="folder-tab" data-folder="archived" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v4H4zM6 8v12h12V8M9 12h6"/></svg> Archived <span id="arcCount">0</span></button>
          </div>
          <div id="list"></div>
          <button
            id="aifab"
            class="aifab"
            aria-label="Ask Hoories AI"
            title="Ask Hoories AI"
          >
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2Z"/><path d="m19 16 .9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9L19 16Z"/></svg><em id="aib" hidden></em>
          </button>
        </aside>
        <section class="room">
          <div class="head">
            <button class="back" id="bk" aria-label="Back">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 5-7 7 7 7" />
              </svg></button
            ><span id="hav"></span>
            <div>
              <h3 id="hn"></h3>
              <small id="hs"></small>
            </div>
            <button
              class="ed"
              id="hed"
              aria-label="Rename contact"
              title="Rename"
            >
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4" />
              </svg></button
            ><button class="ed" id="fav" aria-label="Favorite" title="Favorite">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <polygon
                  points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                />
              </svg></button
            ><span class="chip" id="hr"></span>
          </div>
          <div id="pinb" class="pinb" hidden></div>
          <div id="msgs" class="msgs"></div>
          <div id="rb" class="rb" hidden>
            <div><b id="rn"></b><span id="rt"></span></div>
            <button id="rx" aria-label="Cancel reply">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6l12 12M18 6 6 18" />
              </svg>
            </button>
          </div>
          <div id="chips" class="chips" hidden></div>
          <div id="emo" class="emo" hidden></div>
          <form id="cf" class="comp">
            <button type="button" class="tgl" id="eb" aria-label="Emoji">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path
                  d="M8.5 14c1 1.5 2.2 2.2 3.5 2.2s2.5-.7 3.5-2.2M9 9.5h.01M15 9.5h.01"
                />
              </svg></button
            ><button
              type="button"
              class="tgl"
              id="mic"
              aria-label="Voice typing"
            >
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"
                />
                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                <line x1="12" y1="19" x2="12" y2="23" />
                <line x1="8" y1="23" x2="16" y2="23" />
              </svg></button
            ><button
              type="button"
              class="tgl"
              id="att"
              aria-label="Send a photo"
              title="Send a photo"
            >
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="3" />
                <circle cx="9" cy="10" r="1.8" />
                <path d="m21 16-5-5-8 8" />
              </svg></button
            ><button type="button" class="tgl" id="pollb" aria-label="Create poll" title="Poll"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7" /></svg></button><input type="file" id="pic" accept="image/*" hidden /><input
              id="tx"
              placeholder="Write a message"
              autocomplete="off"
            /><button class="send" aria-label="Send">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 3 10 14M21 3l-7 18-4-7-7-4z" />
              </svg>
            </button>
          </form>
        </section>
      </div>
      <section id="dashv" class="dash" hidden></section>
      <section id="statv" class="dash" hidden></section>
      <section id="profv" class="dash" hidden></section>
    </div>

    <div id="rxpick" class="rxpick" hidden></div>
    <div id="lb" class="lb" hidden><img id="lbi" alt="Photo" /></div>
    <div id="md" class="mdl" hidden><div id="mc" class="mc"></div></div>
    <div id="sv" class="sv" hidden></div>
    <div id="cl" class="cl" hidden></div>
    <div id="toast" class="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="env.js"></script>
    <script src="App.js"></script>
  </body>
</html>
