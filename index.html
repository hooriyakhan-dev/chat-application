<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hoories — your people, always close</title>
<link rel="icon" type="icon/png" href="icon.png">
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Bricolage+Grotesque:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sky"><i></i><i></i><i></i></div>

    <div id="app" class="app" hidden>
      <nav class="rail">
        <div class="logo">H.</div>
        <button class="nav on" data-v="chat" title="Chats" aria-label="Chats">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.6-.8L3 21l1.9-5.2A8.4 8.4 0 1 1 21 11.5z"
            /></svg
          ><em id="unr"></em>
        </button>

        <button class="nav" data-v="prof" title="Profile" aria-label="Profile">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
          </svg>
        </button>
        <div class="sp"></div>
        <button
          class="nav"
          id="thb"
          title="Light or dark"
          aria-label="Toggle theme"
        >
          ☾
        </button>
        <button
          id="meBtn"
          title="Change profile photo"
          aria-label="Change profile photo"
        >
          <span id="meAv"></span>
        </button>
        <input type="file" id="af2" accept="image/*" hidden />
        <button class="out" id="lo">Log out</button>
      </nav>
      <div id="chatv" class="chatv">
        <aside class="list">
          <div class="lh">
            <h2>Chats</h2>
            <button
              class="addp"
              id="addp"
              aria-label="Add a person"
              title="Add a person"
            >
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
              </svg>
            </button>
          </div>
          <input class="q" id="q" placeholder="Search people and groups" />
          <div id="list"></div>
          <button
            id="aifab"
            class="aifab"
            aria-label="Ask Hoories AI"
            title="Ask Hoories AI"
          >
            ✦<em id="aib" hidden></em>
          </button>
        </aside>
        <section class="room">
          <div class="head">
            <button class="back" id="bk" aria-label="Back">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 5-7 7 7 7" />
              </svg></button
            ><span id="hav"></span>
            <div>
              <h3 id="hn"></h3>
              <small id="hs"></small>
            </div>
            <button
              class="ed"
              id="hed"
              aria-label="Rename contact"
              title="Rename"
            >
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4" />
              </svg></button
            ><span class="chip" id="hr"></span>
          </div>
          <div id="msgs" class="msgs"></div>
          <div id="rb" class="rb" hidden>
            <div><b id="rn"></b><span id="rt"></span></div>
            <button id="rx" aria-label="Cancel reply">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6l12 12M18 6 6 18" />
              </svg>
            </button>
          </div>
          <div id="chips" class="chips" hidden></div>
          <div id="emo" class="emo" hidden></div>
          <form id="cf" class="comp">
            <button type="button" class="tgl" id="eb" aria-label="Emoji">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path
                  d="M8.5 14c1 1.5 2.2 2.2 3.5 2.2s2.5-.7 3.5-2.2M9 9.5h.01M15 9.5h.01"
                />
              </svg></button
            ><button
              type="button"
              class="tgl"
              id="mic"
              aria-label="Voice typing"
            >
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"
                />
                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                <line x1="12" y1="19" x2="12" y2="23" />
                <line x1="8" y1="23" x2="16" y2="23" />
              </svg></button
            ><input
              id="tx"
              placeholder="Write a message"
              autocomplete="off"
            /><button class="send" aria-label="Send">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 3 10 14M21 3l-7 18-4-7-7-4z" />
              </svg>
            </button>
          </form>
        </section>
      </div>
      <section id="profv" class="dash" hidden></section>
    </div>

    <div id="md" class="mdl" hidden><div id="mc" class="mc"></div></div>
    <div id="toast" class="toast"></div>

    <script src="env.js"></script>
    <script src="app.js"></script>
  </body>
</html>
